<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <!-- Trofeo -->
  <g transform="translate(120 10)">
    <path d="M-28 0 h56 v18 a28 28 0 0 1 -56 0 z" fill="#f2b705" stroke="#b07d00" stroke-width="3"/>
    <path d="M-28 6 h-12 a10 10 0 0 0 12 18" fill="none" stroke="#b07d00" stroke-width="4"/>
    <path d="M28 6 h12 a10 10 0 0 1 -12 18" fill="none" stroke="#b07d00" stroke-width="4"/>
    <rect x="-5" y="44" width="10" height="12" fill="#f2b705" stroke="#b07d00" stroke-width="2"/>
    <rect x="-18" y="56" width="36" height="8" rx="2" fill="#b07d00"/>
    <polygon points="0,8 4,18 14,18 6,24 9,34 0,28 -9,34 -6,24 -14,18 -4,18" fill="#fff4c2"/>
  </g>
  <!-- Brazos levantando el trofeo -->
  <path d="M68 120 Q60 90 98 74" fill="none" stroke="#e3b48f" stroke-width="10" stroke-linecap="round"/>
  <path d="M172 120 Q180 90 142 74" fill="none" stroke="#e3b48f" stroke-width="10" stroke-linecap="round"/>
  <!-- Colchón con rayas rojiblancas -->
  <clipPath id="cuerpo"><rect x="50" y="100" width="140" height="130" rx="22"/></clipPath>
  <g clip-path="url(#cuerpo)">
    <rect x="50" y="100" width="140" height="130" fill="#ffffff"/>
    <rect x="50"  y="100" width="20" height="130" fill="#d81e2c"/>
    <rect x="90"  y="100" width="20" height="130" fill="#d81e2c"/>
    <rect x="130" y="100" width="20" height="130" fill="#d81e2c"/>
    <rect x="170" y="100" width="20" height="130" fill="#d81e2c"/>
  </g>
  <rect x="50" y="100" width="140" height="130" rx="22" fill="none" stroke="#7a0f17" stroke-width="4"/>
  <!-- Botones del colchón -->
  <g fill="#7a0f17" opacity="0.5">
    <circle cx="80" cy="200" r="3"/><circle cx="120" cy="210" r="3"/><circle cx="160" cy="200" r="3"/>
  </g>
  <!-- Cara -->
  <rect x="78" y="122" width="84" height="56" rx="24" fill="#ffffff" stroke="#7a0f17" stroke-width="2"/>
  <circle cx="104" cy="142" r="6" fill="#1a1a1a"/>
  <circle cx="136" cy="142" r="6" fill="#1a1a1a"/>
  <circle cx="106" cy="140" r="2" fill="#ffffff"/>
  <circle cx="138" cy="140" r="2" fill="#ffffff"/>
  <path d="M102 158 Q120 174 138 158" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Piernas -->
  <rect x="82" y="228" width="14" height="22" rx="6" fill="#1f3a93"/>
  <rect x="144" y="228" width="14" height="22" rx="6" fill="#1f3a93"/>
</svg>
